<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Borderless | Join the network</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css" /></head>
<body class="hubx-body phase-body"><header class="hubx-main-nav phase-nav"><div class="hubx-nav-inner"><a href="index.html" class="hubx-logo"><span class="home-logo-mark">B</span>Borderless</a><nav class="hubx-nav-links"><a href="index.html">Browse</a><a href="companies.html">Companies</a><a href="rfqs.html">RFQs</a></nav><a href="dashboard.html" class="hubx-cta">Workspace</a></div></header><main class="phase-main"><section class="phase-page-heading phase-heading-compact"><div><p class="phase-kicker">Join the network</p><h1>Put your business in the flow of trade.</h1><p>Register your role, markets, and categories. Borderless will review the profile before showing it as a trusted counterparty.</p></div></section><div class="phase-success" data-phase-success></div><div class="phase-error" data-phase-error></div><section class="phase-panel phase-onboarding-panel"><div class="phase-panel-heading"><div><p class="phase-kicker">Business profile</p><h2>Tell us what you trade</h2></div></div><form class="phase-form-grid" data-onboarding-form><label>Business name<input name="name" required placeholder="Example: Lagos Produce Co." /></label><label>Role<select name="role" required><option value="supplier">Supplier / exporter</option><option value="buyer">Buyer / importer</option><option value="manufacturer">Manufacturer</option><option value="processor">Agricultural processor</option><option value="trader">Commodity trader</option></select></label><label>Country<input name="country" required placeholder="Example: Nigeria" /></label><label>Year established<input name="yearEstablished" placeholder="Example: 2018" /></label><label>Markets served<input name="markets" placeholder="Ghana, Kenya, UAE" /></label><label>Product categories<input name="categories" placeholder="Sesame, cashew, grains" /></label><label class="phase-form-wide">Business description<textarea name="description" placeholder="What do you supply or source?"></textarea></label><div class="phase-form-wide"><button class="phase-button phase-button-primary" type="submit">Create business profile <span>↗</span></button></div></form></section></main><script src="phase1.js"></script></body></html>
